name: TUR BANK Android CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tur-bank-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_COMPILE_SDK: "35"
      ANDROID_BUILD_TOOLS: "35.0.0"
      CI_REPORT_DIR: ${{ github.workspace }}/ci-report

    steps:
      - name: Check out source
        id: checkout
        uses: actions/checkout@v7

      - name: Initialize diagnostic report directory
        id: init_report
        if: always()
        shell: bash
        run: |
          mkdir -p "$CI_REPORT_DIR"
          {
            echo "TUR BANK Android CI diagnostics"
            echo "UTC time: $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Workflow: $GITHUB_WORKFLOW"
            echo "Run ID: $GITHUB_RUN_ID"
            echo "Run attempt: $GITHUB_RUN_ATTEMPT"
            echo "Commit: $GITHUB_SHA"
            echo "Runner: $RUNNER_OS / $RUNNER_ARCH"
          } > "$CI_REPORT_DIR/diagnostics.txt"

      # Supports either a normal source tree or TUR-BANK-SOURCE.zip committed
      # to the repository. The source ZIP is extracted before Gradle caching.
      - name: Locate or extract Android project
        id: locate_project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CI_REPORT_DIR"

          find_project_file() {
            find "$1" -type f \
              \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
              -not -path '*/.git/*' -not -path '*/.gradle/*' \
              -print -quit 2>/dev/null || true
          }

          SETTINGS_FILE="$(find_project_file "$GITHUB_WORKSPACE")"

          if [[ -z "$SETTINGS_FILE" ]]; then
            SOURCE_ZIP="$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -name 'TUR-BANK-SOURCE.zip' -print -quit 2>/dev/null || true)"
            if [[ -n "$SOURCE_ZIP" ]]; then
              EXTRACT_DIR="$GITHUB_WORKSPACE/.ci-source-extracted"
              rm -rf "$EXTRACT_DIR"
              mkdir -p "$EXTRACT_DIR"
              if ! unzip -oq "$SOURCE_ZIP" -d "$EXTRACT_DIR"; then
                echo "Could not extract $SOURCE_ZIP" | tee "$CI_REPORT_DIR/project-discovery.log"
                exit 1
              fi
              SETTINGS_FILE="$(find_project_file "$EXTRACT_DIR")"
            fi
          fi

          if [[ -z "$SETTINGS_FILE" ]]; then
            {
              echo "No settings.gradle.kts or settings.gradle was found in the checked-out repository."
              echo
              echo "Expected: Android source files in the repository, or TUR-BANK-SOURCE.zip in the repository."
              echo
              echo "Repository files (first 250):"
              find "$GITHUB_WORKSPACE" -maxdepth 5 -type f \
                -not -path '*/.git/*' -print | sort | head -250
            } > "$CI_REPORT_DIR/project-discovery.log"
            cat "$CI_REPORT_DIR/project-discovery.log"
            echo "::error::Android project not found. Upload the extracted project or add TUR-BANK-SOURCE.zip to the repository root. The failure report will be uploaded." 
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          if [[ ! -f "$PROJECT_DIR/gradlew" ]]; then
            echo "Found $SETTINGS_FILE but gradlew is missing from $PROJECT_DIR" | tee "$CI_REPORT_DIR/project-discovery.log"
            echo "::error::Gradle wrapper script gradlew is missing."
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          {
            echo "Discovered Android project: $PROJECT_DIR"
            echo "Settings file: $SETTINGS_FILE"
            echo "Gradle wrapper: $PROJECT_DIR/gradlew"
          } | tee "$CI_REPORT_DIR/project-discovery.log"
          printf '\nProject path: %s\n' "$PROJECT_DIR" >> "$CI_REPORT_DIR/diagnostics.txt"

      - name: Set up JDK 17 and cache Gradle dependencies
        id: setup_java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
            **/gradle/libs.versions.toml
            **/gradle.properties

      - name: Set up Android SDK
