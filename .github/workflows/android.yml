name: TUR BANK Android CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tur-bank-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_COMPILE_SDK: "35"
      ANDROID_BUILD_TOOLS: "35.0.0"
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17 and cache Gradle dependencies
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
            gradle/libs.versions.toml

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Accept SDK licences and verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}" "platform-tools"
          java -version
          ./gradlew --version

      - name: Run unit tests
        shell: bash
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        shell: bash
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$APK" ]]; then
            echo "::error::Gradle completed without producing a non-empty debug APK at $APK."
            exit 1
          fi
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload TUR BANK APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: TUR-BANK-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Report failed build or tests
        if: failure()
        shell: bash
        run: |
          echo "::error::TUR BANK unit tests or debug APK build failed. No successful APK artifact is being reported."
