name: TUR BANK Android CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tur-bank-plus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI_REPORT_DIR: ${{ github.workspace }}/ci-report

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Initialize diagnostic report
        if: always()
        shell: bash
        run: |
          mkdir -p "$CI_REPORT_DIR"
          {
            echo "TUR BANK Android CI diagnostics"
            echo "UTC time: $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Workflow: $GITHUB_WORKFLOW"
            echo "Run ID: $GITHUB_RUN_ID"
            echo "Run attempt: $GITHUB_RUN_ATTEMPT"
            echo "Commit: $GITHUB_SHA"
            echo "Runner: $RUNNER_OS / $RUNNER_ARCH"
          } > "$CI_REPORT_DIR/diagnostics.txt"

      - name: Locate or extract Android project
        id: locate_project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CI_REPORT_DIR"

          find_settings() {
            local root="$1"
            local result=""
            result="$(find "$root" -type f -name 'settings.gradle.kts' -not -path '*/.git/*' -not -path '*/.gradle/*' -not -path '*/build/*' -print -quit 2>/dev/null || true)"
            if [[ -z "$result" ]]; then
              result="$(find "$root" -type f -name 'settings.gradle' -not -path '*/.git/*' -not -path '*/.gradle/*' -not -path '*/build/*' -print -quit 2>/dev/null || true)"
            fi
            printf '%s' "$result"
          }

          SETTINGS_FILE="$(find_settings "$GITHUB_WORKSPACE")"
          if [[ -z "$SETTINGS_FILE" ]]; then
            SOURCE_ZIP="$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -iname 'TUR-BANK-SOURCE.zip' -print -quit 2>/dev/null || true)"
            if [[ -z "$SOURCE_ZIP" ]]; then
              SOURCE_ZIP="$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -iname '*.zip' -print -quit 2>/dev/null || true)"
            fi
            if [[ -n "$SOURCE_ZIP" ]]; then
              EXTRACT_DIR="$GITHUB_WORKSPACE/.ci-source-extracted"
              rm -rf "$EXTRACT_DIR"
              mkdir -p "$EXTRACT_DIR"
              unzip -oq "$SOURCE_ZIP" -d "$EXTRACT_DIR"
              SETTINGS_FILE="$(find_settings "$EXTRACT_DIR")"
              echo "Extracted source archive: $SOURCE_ZIP" | tee "$CI_REPORT_DIR/project-discovery.log"
            fi
          fi

          if [[ -z "$SETTINGS_FILE" ]]; then
            {
              echo "Android project not found."
              echo "Expected settings.gradle(.kts) in the repository or an Android source ZIP."
              echo "Repository files (first 250):"
              find "$GITHUB_WORKSPACE" -maxdepth 5 -type f -not -path '*/.git/*' -print | sort | head -250
            } > "$CI_REPORT_DIR/project-discovery.log"
            cat "$CI_REPORT_DIR/project-discovery.log"
            echo "::error::Android project not found. Put the project in the repository or add TUR-BANK-SOURCE.zip."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          if [[ ! -f "$PROJECT_DIR/app/build.gradle.kts" && ! -f "$PROJECT_DIR/app/build.gradle" ]]; then
            echo "Android app module build.gradle(.kts) was not found under $PROJECT_DIR" | tee -a "$CI_REPORT_DIR/project-discovery.log"
            echo "::error::Android app module build file is missing."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          {
            echo "Project directory: $PROJECT_DIR"
            echo "Settings file: $SETTINGS_FILE"
            echo "Gradle invocation: installed Gradle (does not depend on the project's wrapper JAR)"
          } | tee -a "$CI_REPORT_DIR/project-discovery.log"
          printf '\nProject path: %s\n' "$PROJECT_DIR" >> "$CI_REPORT_DIR/diagnostics.txt"

      - name: Apply source compilation fix
        id: apply_source_fix
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$PROJECT_DIR/app/src/main/java/com/turbank/mobile/ui/BankScreens.kt"
          if [[ ! -f "$TARGET" ]]; then
            echo "::error::Expected Kotlin screen file not found: $TARGET"
            exit 1
          fi
          if grep -Fq 'snackbar.showSnackbar(message = localizeMessage(it))' "$TARGET"; then
            if [[ ! -f "$GITHUB_WORKSPACE/ci-patches/BankScreens.patch" ]]; then
              echo "::error::Known Compose fix patch is missing."
              exit 1
            fi
            patch --batch --forward -p1 -d "$PROJECT_DIR" < "$GITHUB_WORKSPACE/ci-patches/BankScreens.patch"
            echo "Applied Compose snackbar localization fix." | tee "$CI_REPORT_DIR/source-fixes.log"
          elif grep -Fq 'val localizedMessage = message?.let { localizeMessage(it) }' "$TARGET"; then
            echo "Compose snackbar localization fix is already present." | tee "$CI_REPORT_DIR/source-fixes.log"
          else
            echo "Unexpected BankScreens.kt content; refusing to guess a patch." | tee "$CI_REPORT_DIR/source-fixes.log"
            echo "::error::Could not identify the expected snackbar code."
            exit 1
          fi

      - name: Apply TUR BANK Plus UI overlays
        id: plus_ui
        shell: bash
        run: |
          set -euo pipefail
          OVERLAY_DIR="$GITHUB_WORKSPACE/ci-overrides/app"
          if [[ ! -d "$OVERLAY_DIR" ]]; then
            echo "::error::Plus UI overlay folder is missing."
            exit 1
          fi
          cp -a "$OVERLAY_DIR/." "$PROJECT_DIR/app/"
          python3 "$GITHUB_WORKSPACE/ci-overrides/apply_plus_ui.py" "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/ci-overrides/apply_card_plus.py" "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/ci-overrides/apply_visual_refresh.py" "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/ci-overrides/apply_personal_upgrade.py" "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/ci-overrides/apply_reference_ui.py" "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/ci-overrides/apply_brand_refresh.py" "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/ci-overrides/apply_modern_experience.py" "$PROJECT_DIR"
          test -f "$PROJECT_DIR/app/src/main/java/com/turbank/mobile/ui/ProfileScreen.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/turbank/mobile/ui/AddFundsScreen.kt"
          grep -Fq 'fun addFunds(' "$PROJECT_DIR/app/src/main/java/com/turbank/mobile/BankViewModel.kt"
          grep -Fq 'composable("add-funds")' "$PROJECT_DIR/app/src/main/java/com/turbank/mobile/ui/BankScreens.kt"
          if grep -Fq 'BankTool("add-funds"' "$PROJECT_DIR/app/src/main/java/com/turbank/mobile/ui/PremiumToolsScreen.kt"; then
            echo "::error::Manual balance editing must remain hidden in Settings."
            exit 1
          fi
          grep -Fq 'stringResource(R.string.secret_add_funds)' "$PROJECT_DIR/app/src/main/java/com/turbank/mobile/ui/BankScreens.kt"
          grep -Fq 'versionName = "1.8.3"' "$PROJECT_DIR/app/build.gradle.kts"
          python3 - "$PROJECT_DIR/app/src/main/res" <<'PY'
          import pathlib, re, sys, xml.etree.ElementTree as ET
          root = pathlib.Path(sys.argv[1])
          found = []
          for path in root.rglob("strings.xml"):
              try:
                  xml = ET.parse(path).getroot()
              except ET.ParseError as exc:
                  raise SystemExit(f"Invalid XML: {path}: {exc}")
              for item in xml.findall("string"):
                  value = "".join(item.itertext())
                  if re.search(r"demo", value, re.IGNORECASE):
                      found.append(f"{path}:{item.attrib.get('name', '?')}: {value}")
          if found:
              print("\n".join(found))
              raise SystemExit("User-facing strings still contain forbidden demo wording.")
          print("All localized string values are clear of demo wording.")
          PY
          test -f "$PROJECT_DIR/app/src/main/java/com/turbank/mobile/ui/PersonalAccountSetupScreen.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/turbank/mobile/ui/QrPaymentScreen.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/turbank/mobile/ui/PremiumToolsScreen.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/turbank/mobile/ui/PaymentsHubScreen.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/turbank/mobile/ui/ReferenceHomeScreen.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/turbank/mobile/ui/TransactionHistoryScreen.kt"
          grep -Fq 'ReferenceHomeScreen(vm, nav, settings)' "$PROJECT_DIR/app/src/main/java/com/turbank/mobile/ui/BankScreens.kt"
          grep -Fq 'TransactionHistoryScreen(vm, nav, settings)' "$PROJECT_DIR/app/src/main/java/com/turbank/mobile/ui/BankScreens.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/turbank/mobile/ui/BrandSplashScreen.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/turbank/mobile/ui/TURBankTextField.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/turbank/mobile/ui/CameraQrScannerScreen.kt"
          test -f "$PROJECT_DIR/app/src/main/res/drawable/ic_tur_bank.xml"
          grep -Fq 'composable("qr-pay")' "$PROJECT_DIR/app/src/main/java/com/turbank/mobile/ui/BankScreens.kt"
          grep -Fq 'composable("payments")' "$PROJECT_DIR/app/src/main/java/com/turbank/mobile/ui/BankScreens.kt"
          grep -Fq 'implementation("com.google.mlkit:barcode-scanning:17.3.0")' "$PROJECT_DIR/app/build.gradle.kts"
          grep -Fq 'androidx.camera:camera-view:1.4.2' "$PROJECT_DIR/app/build.gradle.kts"
          if grep -Eq 'text-recognition|image-labeling|zxing-android-embedded' "$PROJECT_DIR/app/build.gradle.kts"; then echo "::error::Removed oversized OCR or external scanner dependencies are still present."; exit 1; fi
          grep -Fq 'BrandSplashScreen()' "$PROJECT_DIR/app/src/main/java/com/turbank/mobile/MainActivity.kt"
          grep -Fq 'android:icon="@drawable/ic_tur_bank"' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          grep -Fq 'TURBANK_PAY_V1' "$PROJECT_DIR/app/src/main/java/com/turbank/mobile/ui/QrPaymentScreen.kt"
          grep -Fq 'versionName = "1.8.3"' "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/java/com/turbank/mobile/ui/FinanceHubScreen.kt"
          grep -Fq 'composable("profile")' "$PROJECT_DIR/app/src/main/java/com/turbank/mobile/ui/BankScreens.kt"
          grep -Fq 'composable("finance-hub")' "$PROJECT_DIR/app/src/main/java/com/turbank/mobile/ui/BankScreens.kt"
          grep -Fq 'DashboardBalanceCard' "$PROJECT_DIR/app/src/main/java/com/turbank/mobile/ui/BankScreens.kt"
          if grep -Fq 'FinanceAcademyScreen' "$PROJECT_DIR/app/src/main/java/com/turbank/mobile/ui/BankScreens.kt"; then
            echo "::error::Obsolete offline academy screen must not be included."
            exit 1
          fi
          echo "Applied animated shared inputs, live CameraX QR scanning, hidden local balance tools, graphite/emerald UI and version 1.8.2; removed oversized OCR/image-labeling dependencies." | tee "$CI_REPORT_DIR/plus-ui.log"

      - name: Remove synthetic APK size filler
        id: remove_synthetic_asset
        shell: bash
        run: |
          set -euo pipefail
          ASSET="$PROJECT_DIR/app/src/main/assets/tur-bank-large-demo-pack.bin"
          if [[ -f "$ASSET" ]]; then
            BYTES="$(stat -c '%s' "$ASSET")"
            rm -f "$ASSET"
            echo "Removed synthetic asset: $BYTES bytes." | tee -a "$CI_REPORT_DIR/source-fixes.log"
          else
            echo "No synthetic size filler found; packaging only real app resources." | tee -a "$CI_REPORT_DIR/source-fixes.log"
          fi
          test ! -e "$ASSET"

      - name: Set up JDK 17
        id: setup_java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        id: setup_gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
          # This project currently has a non-standard wrapper JAR. Gradle is
          # installed directly above, so do not execute wrapper validation.
          validate-wrappers: false

      - name: Set up Android SDK
        id: setup_android
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$SDK_ROOT/cmdline-tools" ]]; then
            echo "::error::Android SDK command-line tools not found under $SDK_ROOT"
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager executable is missing under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --version 2>&1 | tee "$CI_REPORT_DIR/android-sdk-toolchain.log"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" 2>&1 | tee "$CI_REPORT_DIR/android-sdk-install.log"

      - name: Verify toolchain and project files
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Java'
            java -version 2>&1
            echo
            echo '## Gradle'
            gradle --version
            echo
            echo '## Android SDK'
            sdkmanager --list_installed
            echo
            echo '## Project files'
            ls -la "$PROJECT_DIR"
          } 2>&1 | tee "$CI_REPORT_DIR/toolchain.log"

      - name: Inspect source files before feature integration
        id: inspect_source
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$CI_REPORT_DIR/source-inspection.txt"
          {
            echo "=== SOURCE FILES ==="
            find "$PROJECT_DIR/app/src/main" -type f -print | grep -E '[.](kt|xml)$' | sort
            echo
            while IFS= read -r FILE; do
              case "$FILE" in
                */MainActivity.kt|*/BankScreens.kt|*/MainViewModel.kt|*/BankViewModel.kt|*/AndroidManifest.xml|*/Entities.kt|*/BankRepository.kt|*/PreferencesRepository.kt|*/BankDatabase.kt|*/values/strings.xml|*/values-tr/strings.xml|*/values-de/strings.xml)
                  echo
                  echo "=== $FILE ==="
                  sed -n '1,1200p' "$FILE"
                  ;;
              esac
            done < <(find "$PROJECT_DIR/app/src/main" -type f -print | grep -E '[.](kt|xml)$' | sort)
          } | tee "$REPORT"

      - name: Run unit tests
        id: unit_tests
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee "$CI_REPORT_DIR/unit-tests.log"

      - name: Build debug APK
        id: build_apk
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" --no-daemon --stacktrace assembleDebug 2>&1 | tee "$CI_REPORT_DIR/apk-build.log"

      - name: Verify APK exists
        id: verify_apk
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$APK_PATH" ]]; then
            echo "::error::Build finished without the expected APK at $APK_PATH"
            exit 1
          fi
          APK_BYTES="$(stat -c '%s' "$APK_PATH")"
          APK_ENTRIES="$(unzip -Z1 "$APK_PATH")"
          if grep -Eq '^assets/academy/.*\.mp4$' <<< "$APK_ENTRIES"; then
            echo "::error::Offline video files must not be bundled in TUR BANK."
            exit 1
          fi
          if grep -Fq 'tur-bank-large-demo-pack.bin' <<< "$APK_ENTRIES"; then
            echo "::error::Synthetic APK size filler must not be packaged."
            exit 1
          fi
          {
            echo "APK path: $APK_PATH"
            echo "APK size: $APK_BYTES bytes"
            echo "APK size in MiB: $(awk -v b="$APK_BYTES" 'BEGIN {printf "%.2f", b/1048576}')"
            echo "Version: 1.8.2"
            echo "Offline videos: none"
            echo "Synthetic filler: none"
            echo "SHA-256: $(sha256sum "$APK_PATH" | awk '{print $1}')"
          } | tee "$CI_REPORT_DIR/apk-verification.txt"

      - name: Upload TUR BANK APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: TUR-BANK-APK
          path: ${{ steps.locate_project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create error report on failure
        if: failure()
        shell: bash
        run: |
          set +e
          REPORT="$CI_REPORT_DIR/TUR-BANK-ERROR-REPORT.md"
          {
            echo '# TUR BANK — Build Error Report'
            echo
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Attempt: $GITHUB_RUN_ATTEMPT"
            echo "- Commit: $GITHUB_SHA"
            echo "- Branch/ref: $GITHUB_REF"
            echo "- Runner: $RUNNER_OS / $RUNNER_ARCH"
            echo "- Project directory: ${PROJECT_DIR:-not discovered}"
            echo
            echo '## Step outcomes'
            echo "- Project discovery: ${{ steps.locate_project.outcome || 'not run' }}"
            echo "- Source fix: ${{ steps.apply_source_fix.outcome || 'not run' }}"
            echo "- JDK setup: ${{ steps.setup_java.outcome || 'not run' }}"
            echo "- Gradle setup: ${{ steps.setup_gradle.outcome || 'not run' }}"
            echo "- Android SDK setup: ${{ steps.setup_android.outcome || 'not run' }}"
            echo "- Unit tests: ${{ steps.unit_tests.outcome || 'not run' }}"
            echo "- APK build: ${{ steps.build_apk.outcome || 'not run' }}"
            echo "- APK verification: ${{ steps.verify_apk.outcome || 'not run' }}"
            echo
            echo '## Available logs'
            for LOG in "$CI_REPORT_DIR"/*.log "$CI_REPORT_DIR"/diagnostics.txt; do
              [[ -f "$LOG" ]] || continue
              echo
              echo "### $(basename "$LOG")"
              echo '```text'
              tail -n 200 "$LOG"
              echo '```'
            done
          } > "$REPORT"
          cat "$REPORT"

      - name: Upload build logs and error report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TUR-BANK-BUILD-REPORT
          path: ${{ github.workspace }}/ci-report/
          if-no-files-found: warn
          retention-days: 14
